<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let path = location.pathname;
  try { path = decodeURIComponent(path); } catch (e) {}
  if (path.length > 40) path = path.slice(0, 39) + '…';
  // textContent only: the path is attacker-controllable URL text
  document.querySelectorAll('.term .path').forEach(el => el.textContent = path);

  // Typewriter: every char stays in the layout (visibility only), so the card never resizes
  const pre = document.querySelector('.term pre');
  const cursor = pre.querySelector('.cursor');
  if (!reduced) {
    cursor.remove();
    const chars = [];
    const walker = document.createTreeWalker(pre, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const frag = document.createDocumentFragment();
      for (const ch of node.data) {
        if (ch === '\n') { frag.append(ch); continue; }
        const s = Object.assign(document.createElement('span'), { className: 'tw', textContent: ch });
        frag.append(s); chars.push(s);
      }
      node.replaceWith(frag);
    }
    const ms = Math.min(30, 2000 / chars.length);
    let i = 0;
    const timer = setInterval(() => {
      chars[i].classList.remove('tw');
      chars[i++].after(cursor);
      if (i === chars.length) clearInterval(timer);
    }, ms);
  }

  // Cursor spotlight, same as scripts.js: transform-only updates, at most one per frame
  if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reduced) {
    const glow = document.createElement('div');
    glow.className = 'spotlight';
    glow.setAttribute('aria-hidden', 'true');
    document.body.prepend(glow);
    let x = 0, y = 0, frame = 0;
    addEventListener('pointermove', e => {
      x = e.clientX; y = e.clientY;
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        glow.style.transform = `translate3d(${x - 300}px, ${y - 300}px, 0)`;
        glow.classList.add('is-on');
      });
    }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => glow.classList.remove('is-on'));
  }
})();
</script>
